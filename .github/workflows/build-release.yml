name: Build & Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: Build artifacts but skip publishing the GitHub Release

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  # ── Linux ────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >-
            libwebkit2gtk-4.1-dev libxdo-dev
            libayatana-appindicator3-dev librsvg2-dev
            imagemagick mold
          version: 1.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install tauri-cli
        run: cargo binstall tauri-cli --version "^2.0" --no-confirm --locked

      - name: Generate icons
        run: |
          src=hermes-webui/static/favicon-512.png
          convert "$src" -resize 32x32   src-tauri/icons/32x32.png
          convert "$src" -resize 128x128 src-tauri/icons/128x128.png
          convert "$src" -resize 256x256 src-tauri/icons/256x256.png
          cp "$src" src-tauri/icons/512x512.png
          cp "$src" src-tauri/icons/icon.png

      - name: Build (deb + AppImage)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_PROFILE_RELEASE_LTO: thin
        run: cd src-tauri && cargo tauri build --bundles deb,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.AppImage.tar.gz
            src-tauri/target/release/bundle/**/*.AppImage.tar.gz.sig

  # ── macOS ────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-${{ matrix.arch }}
          cache-on-failure: true

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install tauri-cli
        run: cargo binstall tauri-cli --version "^2.0" --no-confirm --locked

      - name: Generate icons
        run: |
          src=hermes-webui/static/favicon-512.png
          sips -z 32   32   "$src" --out src-tauri/icons/32x32.png
          sips -z 128  128  "$src" --out src-tauri/icons/128x128.png
          sips -z 256  256  "$src" --out src-tauri/icons/256x256.png
          cp "$src" src-tauri/icons/512x512.png
          cp "$src" src-tauri/icons/icon.png

      - name: Build (dmg)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_PROFILE_RELEASE_LTO: thin
        run: |
          cd src-tauri
          cargo tauri build --bundles dmg --target ${{ matrix.arch }}-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-artifacts
          path: |
            src-tauri/target/${{ matrix.arch }}-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.arch }}-apple-darwin/release/bundle/**/*.dmg.sig

  # ── Windows ──────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install tauri-cli
        run: cargo binstall tauri-cli --version "^2.0" --no-confirm --locked

      - name: Generate icons
        shell: pwsh
        run: |
          $src = "hermes-webui\static\favicon-512.png"
          Copy-Item $src src-tauri\icons\32x32.png
          Copy-Item $src src-tauri\icons\128x128.png
          Copy-Item $src src-tauri\icons\256x256.png
          Copy-Item $src src-tauri\icons\512x512.png
          Copy-Item $src src-tauri\icons\icon.png

      - name: Build (nsis installer)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_PROFILE_RELEASE_LTO: thin
        run: cd src-tauri && cargo tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.exe.sig
            src-tauri/target/release/bundle/**/*.nsis.zip
            src-tauri/target/release/bundle/**/*.nsis.zip.sig

  # ── Publish GitHub Release ───────────────────────────────────────────────────
  publish:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      github.event.inputs.dry_run != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate latest.json for auto-updater
        run: python3 scripts/generate-update-manifest.py > latest.json

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
            latest.json
