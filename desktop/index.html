<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hermes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
    }
    .logo { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }
    .status { font-size: 0.9rem; color: #8b949e; }
    .dot {
      display: inline-block;
      animation: blink 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }
    #error {
      display: none;
      color: #f85149;
      font-size: 0.85rem;
      max-width: 420px;
      text-align: center;
      line-height: 1.5;
      background: #1c1c2e;
      padding: 12px 18px;
      border-radius: 6px;
      border: 1px solid #3d1a1a;
    }
  </style>
</head>
<body>
  <div class="logo">Hermes</div>
  <div class="status" id="status">
    Starting<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
  </div>
  <div id="error"></div>
  <script>
    window.__hermesShowError = function(msg) {
      document.getElementById('status').style.display = 'none';
      const el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
    };
  </script>
</body>
</html>
